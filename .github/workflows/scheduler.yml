name: Chip Signal Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: |
            state.json
            archive.jsonl
          key: chip-signal-state-${{ github.run_id }}
          restore-keys: |
            chip-signal-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_POSTS_PER_RUN: "2"
          LOOKBACK_HOURS: "48"
        run: |
          python main.py

      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: |
            state.json
            archive.jsonl
          key: chip-signal-state-${{ github.run_id }}
